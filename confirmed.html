<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booked · Craves &amp; Crumble</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- F10 Confirmed -->
  <nav class="nav">
    <a class="logo" href="index.html"><img src="images/logo.png" alt="Craves &amp; Crumble"></a>
    <div class="links">
      <a href="menu.html">Menu</a>
      <a href="hours.html">Hours &amp; locations</a>
      <a href="events.html">Private events</a>
    </div>
    <a class="btn btn-primary" href="index.html">Reserve</a>
  </nav>

  <main class="confirm">
    <img src="images/photo-3-brunch-table.png" alt="Brunch table with poached eggs, grain bowls and coffee">
    <div>
      <h1 id="heading">Reservation confirmed</h1>
      <p id="conf-line"></p>
      <dl class="review-list" id="details"></dl>
      <!-- R-9 live wait, from 15 minutes before the booking -->
      <section class="live-wait" id="live-wait" data-no-translate aria-labelledby="lw-title">
        <h2 id="lw-title">Live wait</h2>
        <p class="lw-text" id="lw-text" role="status" aria-live="polite"></p>
        <p class="help" id="lw-updated"></p>
        <p class="help" id="lw-demo" hidden></p>
        <p class="help"><a href="?demo=1" id="lw-preview"></a></p>
      </section>
      <hr>
      <button type="button" class="btn" id="add-cal">Add to calendar</button>
      <button type="button" class="btn" id="directions">Get directions</button>
      <p class="help" id="grat-note"></p>
      <p class="help">Need to change or cancel? Please let us know at least 4 hours ahead by calling <span id="loc-phone"></span>. Tables are held for 15 minutes past your booking time, then released to walk-in guests.</p>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/waitlist.js"></script>
  <script src="js/livewait.js"></script>
  <script src="js/gordon-voice.js"></script>
  <script src="js/assist.js"></script>
  <script>
    // The booking page only passes a minimized, encrypted record (see saveBooking in js/common.js):
    // first name, last 4 phone digits and a count of dietary needs. No full name, number or health details.
    const sample = {
      // fallback sample so the page still shows something when opened directly
      location: 'Oshawa', party: 2, date: '2026-11-06', time: '11:00 am',
      table: 'No preference', firstName: 'Guest', phoneLast4: '0100', dietCount: 0,
    };
    (async () => {
      let b = await loadBooking();
      if (!b || !LOCATIONS[b.location]) b = sample;
      const conf = String(Math.floor(100000 + Math.random() * 900000));
      const date = new Date(b.date + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
      document.getElementById('heading').textContent = b.firstName ? `Reservation confirmed, ${b.firstName}.` : 'Reservation confirmed.';
      document.getElementById('conf-line').textContent = `Confirmation #${conf}. We've texted it to the number ending in ${b.phoneLast4}.`;
      document.getElementById('directions').textContent = `Get directions to ${LOCATIONS[b.location].address}`;
      document.getElementById('grat-note').textContent = gratuityNote(b.party);
      document.getElementById('loc-phone').textContent = LOCATIONS[b.location].phone;
      const diet = !b.dietCount ? 'None' : b.dietCount === 1 ? '1 need noted for the kitchen' : `${b.dietCount} needs noted for the kitchen`;
      const rows = [
        ['Location', `${b.location}, ${LOCATIONS[b.location].address}`], ['Date', date], ['Time', b.time], ['Party size', b.party],
        ['Seating', b.table], ['Dietary needs', diet],
      ];
      // Get directions: Google Maps to the booked location
      document.getElementById('directions').addEventListener('click', () => window.open(directionsUrl(b.location), '_blank', 'noopener'));
      // Add to calendar: downloads a .ics file that Google, Apple and Outlook calendars all open
      document.getElementById('add-cal').addEventListener('click', () => {
        const m = /^(\d{1,2}):(\d{2}) (am|pm)$/.exec(b.time) || [0, '11', '00', 'am'];
        const h = (Number(m[1]) % 12) + (m[3] === 'pm' ? 12 : 0);
        const ymd = b.date.replace(/-/g, '');
        const t = (hh, mm) => `${ymd}T${String(hh).padStart(2, '0')}${String(mm).padStart(2, '0')}00`;
        const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Craves and Crumble//Reservation//EN', 'BEGIN:VEVENT',
          `UID:${conf}@cravesandcrumble.com`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
          `DTSTART:${t(h, m[2])}`, `DTEND:${t(h + 1, m[2])}`,
          `SUMMARY:Brunch at Craves & Crumble (${b.location})`,
          `LOCATION:${LOCATIONS[b.location].address.replace(/,/g, '\\,')}`,
          `DESCRIPTION:Party of ${b.party}. Confirmation #${conf}. To change or cancel call ${LOCATIONS[b.location].phone}.`,
          'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
        a.download = 'craves-and-crumble-reservation.ics';
        document.body.append(a); a.click(); a.remove();
      });
      document.getElementById('details').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd><span></span>`).join('');
    })();
  </script>
</body>
</html>
